global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'event-publisher'
    static_configs:
      - targets: ['publisher:8000']

  - job_name: 'event-worker'
    static_configs:
      - targets: ['worker:8000']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
