services:
  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-platform}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-platform}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  publisher:
    build:
      context: ./services/publisher
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://platform:platform@rabbitmq:5672/}
      QUEUE_NAME: ${QUEUE_NAME:-events}
      EXCHANGE_NAME: ${EXCHANGE_NAME:-events}
      ROUTING_KEY: ${ROUTING_KEY:-events.created}
      DEAD_LETTER_EXCHANGE: ${DEAD_LETTER_EXCHANGE:-events.dlx}
      DEAD_LETTER_QUEUE: ${DEAD_LETTER_QUEUE:-events.dead}
      DEAD_LETTER_ROUTING_KEY: ${DEAD_LETTER_ROUTING_KEY:-events.dead}
    depends_on:
      rabbitmq:
        condition: service_healthy
    tmpfs:
      - /tmp

  worker:
    build:
      context: ./services/worker
    ports:
      - "8001:8000"
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://platform:platform@rabbitmq:5672/}
      QUEUE_NAME: ${QUEUE_NAME:-events}
      EXCHANGE_NAME: ${EXCHANGE_NAME:-events}
      ROUTING_KEY: ${ROUTING_KEY:-events.created}
      DEAD_LETTER_EXCHANGE: ${DEAD_LETTER_EXCHANGE:-events.dlx}
      DEAD_LETTER_QUEUE: ${DEAD_LETTER_QUEUE:-events.dead}
      DEAD_LETTER_ROUTING_KEY: ${DEAD_LETTER_ROUTING_KEY:-events.dead}
      PROCESS_SECONDS: ${PROCESS_SECONDS:-0.15}
      MAX_RETRIES: ${MAX_RETRIES:-3}
    depends_on:
      rabbitmq:
        condition: service_healthy
    tmpfs:
      - /tmp

  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/local-monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - publisher
      - worker

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/local-monitoring/grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  rabbitmq-data:
