apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: event-platform-monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: event-platform
  source:
    repoURL: https://github.com/your-org/keda-event-platform.git
    targetRevision: main
    path: deploy/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
