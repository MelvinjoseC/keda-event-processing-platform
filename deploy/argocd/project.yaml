apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: event-platform
  namespace: argocd
spec:
  description: Event processing platform applications and observability overlays.
  sourceRepos:
    - https://github.com/your-org/keda-event-platform.git
  destinations:
    - namespace: event-platform
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
