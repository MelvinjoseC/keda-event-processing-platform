apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "event-platform.componentName" (dict "root" . "component" "publisher") }}
  labels:
    {{- include "event-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: publisher
spec:
  replicas: {{ .Values.publisher.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "event-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: publisher
  template:
    metadata:
      labels:
        {{- include "event-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: publisher
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.publisher.terminationGracePeriodSeconds | default 30 }}
      serviceAccountName: {{ include "event-platform.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: publisher
          image: "{{ .Values.publisher.image.repository }}:{{ .Values.publisher.image.tag }}"
          imagePullPolicy: {{ .Values.publisher.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "event-platform.fullname" . }}
          env:
            - name: SERVICE_NAME
              value: event-publisher
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "event-platform.secretName" . }}
                  key: RABBITMQ_URL
          {{- range $key, $value := .Values.publisher.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.publisher.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "event-platform.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: publisher
      {{- end }}
      {{- with .Values.publisher.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.publisher.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.publisher.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
