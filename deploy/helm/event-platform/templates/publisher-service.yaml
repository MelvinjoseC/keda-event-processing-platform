apiVersion: v1
kind: Service
metadata:
  name: {{ include "event-platform.componentName" (dict "root" . "component" "publisher") }}
  labels:
    {{- include "event-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: publisher
spec:
  type: {{ .Values.publisher.service.type }}
  ports:
    - name: http
      port: {{ .Values.publisher.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "event-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: publisher
